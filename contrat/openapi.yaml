openapi: 3.0.3
info:
  title: EventsHub API
  version: 1.0.0
paths:                                                                                                                                                                            
   
    /events:                                                                                                                                                                        
      get:        
        summary: Récupérer la liste des événements
        description: Récupère les événements avec filtrage optionnel.
        parameters:
          - name: q
            in: query
            schema:
              type: string
            description: Recherche par mot-clé
          - name: category
            in: query
            schema:
              type: string
            description: Filtrer par catégorie
          - name: from
            in: query
            schema:
              type: string
              format: date
            description: Date de début (incluse)
          - name: to
            in: query
            schema:
              type: string
              format: date
            description: Date de fin (incluse)
          - name: city
            in: query
            schema:
              type: string
            description: Filtrer par ville
        responses:
          "200":
            description: Liste des événements récupérée.
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: "#/components/schemas/Event"
          "500":
            description: Erreur interne du serveur.

    /users:
      get:
        summary: Récupérer la liste des utilisateurs (admin)
        description: Réservé aux administrateurs.
        security:
          - cookieAuth: []
        responses:
          "200":
            description: Liste des utilisateurs récupérée.
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: "#/components/schemas/User"
          "401":
            description: Non authentifié.
          "403":
            description: Accès refusé (rôle admin requis).
          "500":
            description: Erreur interne du serveur.

    /admin/events:
      get:
        summary: Récupérer tous les événements (admin)
        description: Réservé aux administrateurs. Inclut les événements annulés. Le total est renvoyé dans l'en-tête X-Total-Count.
        security:
          - cookieAuth: []
        parameters:
          - name: page
            in: query
            schema:
              type: integer
              minimum: 1
              default: 1
          - name: pageSize
            in: query
            schema:
              type: integer
              minimum: 1
              maximum: 100
              default: 20
        responses:
          "200":
            description: Liste des événements récupérée.
            headers:
              X-Total-Count:
                description: Nombre total d'événements.
                schema:
                  type: integer
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: "#/components/schemas/Event"
          "400":
            description: Paramètres de pagination invalides.
          "401":
            description: Non authentifié.
          "403":
            description: Accès refusé (rôle admin requis).
          "500":
            description: Erreur interne du serveur.

    /admin/events/{id}:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      patch:
        summary: Modifier n'importe quel événement (admin)
        description: Réservé aux administrateurs. Seuls les champs envoyés sont modifiés.
        security:
          - cookieAuth: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventUpdate"
        responses:
          "200":
            description: Événement modifié.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Event"
          "400":
            description: Données invalides (corps vide, champ inconnu, valeur hors bornes…).
          "401":
            description: Non authentifié.
          "403":
            description: Accès refusé (rôle admin requis).
          "404":
            description: Événement introuvable.
          "500":
            description: Erreur interne du serveur.
      delete:
        summary: Supprimer n'importe quel événement (admin)
        description: Réservé aux administrateurs. Supprime aussi les billets et favoris de l'événement.
        security:
          - cookieAuth: []
        responses:
          "204":
            description: Événement supprimé.
          "401":
            description: Non authentifié.
          "403":
            description: Accès refusé (rôle admin requis).
          "404":
            description: Événement introuvable.
          "500":
            description: Erreur interne du serveur.

    /api/auth/sign-up/email:
      post:
        summary: "Inscription d'un utilisateur"
        description: Crée un nouveau compte via Better Auth. La session est établie via un cookie httpOnly.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRegister"
        responses:
          "200":
            description: "Compte créé, session ouverte."
            headers:
              Set-Cookie:
                description: Cookie de session httpOnly posé par Better Auth.
                schema:
                  type: string
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuthResponse"
          "400":
            description: Données invalides (champ manquant, email malformé…).
          "422":
            description: "L'email est déjà utilisé."
          "500":
            description: Erreur interne du serveur.

    /api/auth/sign-in/email:
      post:
        summary: "Connexion d'un utilisateur"
        description: Authentifie un utilisateur via Better Auth. La session est établie via un cookie httpOnly.
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLogin"
        responses:
          "200":
            description: Authentification réussie.
            headers:
              Set-Cookie:
                description: Cookie de session httpOnly posé par Better Auth.
                schema:
                  type: string
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuthResponse"
          "400":
            description: Données invalides.
          "401":
            description: Identifiants incorrects.
          "500":
            description: Erreur interne du serveur.

    /api/auth/sign-out:
      post:
        summary: "Déconnexion"
        description: Invalide la session courante.
        security:
          - cookieAuth: []
        responses:
          "200":
            description: Déconnecté avec succès.
          "401":
            description: Aucune session active.

    /api/auth/get-session:
      get:
        summary: "Récupérer la session courante"
        description: Retourne l'utilisateur et la session associés au cookie présent.
        security:
          - cookieAuth: []
        responses:
          "200":
            description: Session valide.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuthResponse"
          "401":
            description: Non authentifié.

components:
    securitySchemes:
      cookieAuth:
        type: apiKey
        in: cookie
        name: better-auth.session_token

    schemas:

      Event:
        type: object
        required:
          - id
          - name
          - organizerId
          - startDate
        properties:
          id:
            type: string
            example: "cuid_abc123"
          name:
            type: string
            example: Hackathon 2026
          description:
            type: string
            nullable: true
          categoryId:
            type: string
            nullable: true
          organizerId:
            type: string
          startDate:
            type: string
            format: date-time
          endDate:
            type: string
            format: date-time
            nullable: true
          location:
            type: string
            example: Paris
          city:
            type: string
          priceCents:
            type: integer
            minimum: 0
          isAccessible:
            type: boolean
          isKidFriendly:
            type: boolean
          latitude:
            type: number
            format: float
            nullable: true
          longitude:
            type: number
            format: float
            nullable: true
          capacity:
            type: integer
            nullable: true
          status:
            type: string
            enum: [published, cancelled]
            default: published
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time

      EventUpdate:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          name:
            type: string
            minLength: 1
          description:
            type: string
            nullable: true
          categoryId:
            type: string
            nullable: true
          startDate:
            type: string
            format: date-time
          endDate:
            type: string
            format: date-time
            nullable: true
            description: Doit être postérieure à startDate si les deux sont envoyées.
          location:
            type: string
            minLength: 1
          city:
            type: string
            minLength: 1
          latitude:
            type: number
            format: float
            nullable: true
          longitude:
            type: number
            format: float
            nullable: true
          capacity:
            type: integer
            minimum: 1
            nullable: true
          status:
            type: string
            enum: [published, cancelled]
          priceCents:
            type: integer
            minimum: 0
          isAccessible:
            type: boolean
          isKidFriendly:
            type: boolean

      User:
        type: object
        properties:
          id:
            type: string
            example: "cuid_abc123"
          name:
            type: string
          email:
            type: string
            format: email
          emailVerified:
            type: boolean
          image:
            type: string
            nullable: true
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time

      UserRegister:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          password:
            type: string
            format: password

      UserLogin:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
          password:
            type: string
            format: password

      Session:
        type: object
        properties:
          id:
            type: string
          userId:
            type: string
          expiresAt:
            type: string
            format: date-time
          ipAddress:
            type: string
            nullable: true
          userAgent:
            type: string
            nullable: true

      AuthResponse:
        type: object
        properties:
          user:
            $ref: "#/components/schemas/User"
          session:
            $ref: "#/components/schemas/Session"