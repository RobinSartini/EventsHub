# Docker Compose for EventsHub
# Full-stack container orchestration

name: EventsHub

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3001
    container_name: EventsHub-web
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - EventsHub-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - apps/server/.env
    container_name: EventsHub-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/EventsHub
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      # Rate limiting speaks Upstash REST; the srh bridge serves it from the local redis.
      - UPSTASH_REDIS_REST_URL=http://srh:80
      - UPSTASH_REDIS_REST_TOKEN=local-srh-token
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      srh:
        condition: service_started
    networks:
      - EventsHub-network

  postgres:
    image: postgres:18-alpine
    container_name: EventsHub-postgres
    environment:
      POSTGRES_DB: EventsHub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - EventsHub_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - EventsHub-network

  redis:
    image: redis:8-alpine
    container_name: EventsHub-redis
    ports:
      - "6379:6379"
    volumes:
      - EventsHub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - EventsHub-network

  srh:
    image: hiett/serverless-redis-http:latest
    container_name: EventsHub-srh
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-srh-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - EventsHub-network

networks:
  EventsHub-network:
    driver: bridge

volumes:
  EventsHub_postgres_data:
  EventsHub_redis_data:
