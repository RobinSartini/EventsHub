# Docker Compose for EventsHub
# Full-stack container orchestration

name: EventsHub

services:
  web:
    platform: ${DOCKER_PLATFORM:-}
    image: ghcr.io/sugow0/eventshub-web:${EVENTSHUB_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3001
    container_name: EventsHub-web
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - EventsHub-network

  server:
    platform: ${DOCKER_PLATFORM:-}
    image: ghcr.io/sugow0/eventshub-server:${EVENTSHUB_TAG:-local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - apps/server/.env
    container_name: EventsHub-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CORS_ORIGIN=http://localhost:3000
      - BETTER_AUTH_URL=http://localhost:3001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - EventsHub-network

  postgres:
    platform: ${DOCKER_PLATFORM:-}
    image: postgres:18-alpine
    container_name: EventsHub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    ports:
      - "5432:5432"
    volumes:
      - EventsHub_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - EventsHub-network

networks:
  EventsHub-network:
    driver: bridge

volumes:
  EventsHub_postgres_data:
