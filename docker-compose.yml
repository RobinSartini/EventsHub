# Docker Compose for EventsHub
# Full-stack container orchestration

name: EventsHub

services:
  web:
    platform: ${DOCKER_PLATFORM:-}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3001
    container_name: EventsHub-web
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - EventsHub-network

  server:
    platform: ${DOCKER_PLATFORM:-}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - apps/server/.env
    container_name: EventsHub-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/EventsHub
      - CORS_ORIGIN=http://localhost:3000
      - BETTER_AUTH_URL=http://localhost:3001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - EventsHub-network

  postgres:
    platform: ${DOCKER_PLATFORM:-}
    image: postgres:18-alpine
    container_name: EventsHub-postgres
    environment:
      POSTGRES_DB: EventsHub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - EventsHub_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - EventsHub-network

networks:
  EventsHub-network:
    driver: bridge

volumes:
  EventsHub_postgres_data:
