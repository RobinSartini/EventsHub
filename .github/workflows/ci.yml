name: CI

on:
  push:
    branches: ["main", "staging", "dev"]
  pull_request:
    branches: ["main", "staging", "dev"]

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    env:
      TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
      DATABASE_URL: postgresql://postgres:password@localhost:5432/EventsHub
      BETTER_AUTH_SECRET: ci-only-dummy-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Audit dependencies
        run: |
          mapfile -t ignores < <(grep -oE '^GHSA-[0-9a-z-]+' .trivyignore | sed 's/^/--ignore=/')
          vp pm audit --level high -- "${ignores[@]}"

      - name: Trivy scan (secrets, misconfigurations)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" fs
          --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs node_modules .

      - name: Check
        run: vp check

      - name: Type check
        run: vp run -r check-types

      - name: Build
        run: vp run -r build

      - name: Test
        run: vp run -r test

  images:
    name: Docker image (${{ matrix.app }})
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [server, web, fumadocs]
    env:
      TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}"
          echo "tags=$image:${GITHUB_REF_NAME}-${GITHUB_SHA::7},$image:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: scan:${{ matrix.app }}
          build-args: VITE_SERVER_URL=${{ vars.VITE_SERVER_URL || 'http://localhost:3001' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Trivy scan (image)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" image
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          scan:${{ matrix.app }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VITE_SERVER_URL=${{ vars.VITE_SERVER_URL || 'http://localhost:3001' }}
          cache-from: type=gha,scope=${{ matrix.app }}
