name: EventsHub

services:
  postgres:
    platform: ${DOCKER_PLATFORM:-}
    image: postgres:18-alpine
    container_name: EventsHub-postgres
    environment:
      POSTGRES_DB: EventsHub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - EventsHub_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  EventsHub_postgres_data:
